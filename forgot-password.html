<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuckBank - Recuperar Contraseña</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="auth-logo">🦆</div>
      <h1 class="auth-brand-name">Duck<span>Bank</span></h1>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">¿Olvidaste tu clave?</h2>
      <p class="auth-subtitle">Ingresa tu correo y te enviaremos un enlace de recuperación seguro.</p>

      <form id="forgotForm">
        <div class="form-group">
          <label class="form-label" for="forgotEmail">Correo electrónico o RUT</label>
          <input type="email" id="forgotEmail" class="form-control" placeholder="tu-correo@duckbank.com" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Enviar Enlace de Recuperación</button>
      </form>

      <div class="auth-footer-text">
        <a href="login.html">← Volver al inicio de sesión</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
