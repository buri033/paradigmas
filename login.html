<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DuckBank - Iniciar Sesión</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">
  <div class="auth-wrapper">
    <div class="auth-brand">
      <div class="auth-logo">🦆</div>
      <h1 class="auth-brand-name">Duck<span>Bank</span></h1>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Bienvenido de nuevo</h2>
      <p class="auth-subtitle">Ingresa tus credenciales para acceder a tu banca en línea.</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Correo electrónico o RUT</label>
          <input type="text" id="email" class="form-control" placeholder="ejemplo@duckbank.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="password-input-group">
            <input type="password" id="password" class="form-control" placeholder="••••••••" required>
          </div>
        </div>

        <div class="remember-row">
          <label>
            <input type="checkbox" id="remember"> Recordar mi usuario
          </label>
          <a href="forgot-password.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full">Iniciar Sesión</button>
      </form>

      <div class="auth-footer-text">
        ¿Aún no tienes cuenta? <a href="register.html">Regístrate aquí</a>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
